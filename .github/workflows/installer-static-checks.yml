name: Installer static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax
        run: bash -n install.sh

      - name: ShellCheck
        run: shellcheck --severity=warning install.sh

      - name: AUR HTML converter removal
        run: |
          if grep -nE '^[[:space:]]*"(html2markdown|38c3-styles)[|]' install.sh; then
            echo "Unwanted HTML conversion AUR package remains in installer"
            exit 1
          fi
          grep -q 'SPACE_GROTESK_SHA256=' install.sh
          grep -q 'd == otf-space-grotesk' install.sh
          grep -q 'fc-match.*Space Grotesk' install.sh
          grep -q 'check_aur_dependencies "$dir" "$base"' install.sh
          grep -q 'check_aur_dependencies "$bdir" "illogical-impulse-$m"' install.sh
          grep -q 'pacman -T "$dep"' install.sh
          grep -Fq "^[[:space:]]*(depends|makedepends|checkdepends)" install.sh
          if grep -nE 'makepkg .*--needed' install.sh; then
            echo "--needed must only be used by makepkg with --install"
            exit 1
          fi
          grep -q 'if \[\[ ! -s \$dest.sig \]\]' install.sh

      - name: Dual-boot safety guard
        run: |
          if grep -nE '(^|[;&|[:space:]])(parted|fdisk|cfdisk|sfdisk|mkfs([.][[:alnum:]]+)?|wipefs|sgdisk|grub-install|grub-mkconfig|efibootmgr|bootctl)([[:space:]]|$)' install.sh; then
            echo "Unexpected partition or bootloader command found in installer"
            exit 1
          fi

      - name: Safe CLI smoke tests
        run: |
          test "$(./install.sh --version)" = "1.0.6"
          ./install.sh --help >/dev/null
