name: Installer static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax
        run: bash -n install.sh

      - name: ShellCheck
        run: shellcheck --severity=warning install.sh

      - name: Safe CLI smoke tests
        run: |
          test "$(./install.sh --version)" = "1.0.0"
          ./install.sh --help >/dev/null
