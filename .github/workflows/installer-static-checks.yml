name: Installer checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n tests/test-installer.sh
          bash -n tests/e2e-simulation.sh

      - name: ShellCheck
        run: shellcheck --severity=warning install.sh tests/test-installer.sh tests/e2e-simulation.sh

      - name: Unit tests
        run: bash tests/test-installer.sh

      - name: End-to-end simulation (mocked system, failure injection, resume, diagnose, repair)
        run: bash tests/e2e-simulation.sh

      - name: Regression guards
        run: |
          # .SRCINFO values must not be cut at the first "=" (cmake>=3.30 -> 3.30).
          if grep -nF 'dep=${line#*=}' install.sh; then
            echo "Versioned dependencies would be truncated"; exit 1
          fi
          # otf-space-grotesk must be provided by a real local package, not a font check.
          grep -q 'provides=(otf-space-grotesk)' install.sh
          if grep -nE '^[[:space:]]*"(html2markdown|38c3-styles)[|]' install.sh; then
            echo "Unwanted HTML conversion AUR package remains in installer"; exit 1
          fi
          # makepkg must never install dependencies itself (hidden background sudo prompt).
          if grep -nE '^[^#]*makepkg[^|#]* (-[A-Za-z]*s[A-Za-z]*|--syncdeps)( |\)|$)' install.sh; then
            echo "makepkg -s found"; exit 1
          fi
          if grep -nE 'makepkg .*--needed' install.sh; then
            echo "--needed must only be used by makepkg with --install"; exit 1
          fi
          # Checkpoints are only trusted after a real-state verification.
          grep -q 'if step_verify "$idx"; then' install.sh
          grep -q 'la vérification après exécution échoue' install.sh

      - name: Dual-boot safety guard
        run: |
          if grep -nE '(^|[;&|[:space:]])(parted|fdisk|cfdisk|sfdisk|gdisk|mkfs([.][[:alnum:]]+)?|wipefs|sgdisk|grub-install|grub-mkconfig|efibootmgr|bootctl|os-prober|mkinitcpio|dracut)([[:space:]]|$)' install.sh; then
            echo "Unexpected partition or bootloader command found in installer"; exit 1
          fi

      - name: Safe CLI smoke tests
        run: |
          test "$(./install.sh --version)" = "2.0.5"
          ./install.sh --help >/dev/null
